# CI aplikasi web Karir: tes unit + cakupan + lint + build Next.js +
# anggaran bundle + tes asap + tes E2E (Playwright).
# Langkah build memakai nilai NEXT_PUBLIC_FIREBASE_* dummy, bukan secret.
# Alasannya: halaman /admin mengimpor lib/firebase.js, dan initializeApp
# jalan saat modul dimuat; tanpa apiKey, build gagal dengan
# auth/invalid-api-key saat prerender. Nilai dummy cukup untuk membangun
# aplikasi, karena build tidak memanggil Firebase sama sekali; kunci asli
# hanya ada di Vercel dan di .env.local lokal, dan keduanya tidak dipakai
# di sini. Nilai dummy ini bukan kunci asli dan tidak membuka apa pun.
# Langkah Smoke menjalankan server production dari hasil build lalu
# memeriksa 5 cek lewat web/scripts/smoke-check.mjs. Kelima cek wajib
# lolos di CI: arsitektur seed-first membuat rute data jatuh ke seed
# dan menjawab 200 saat Firestore tak terjangkau (kunci dummy), jadi
# ketiga cek data (/api/stats, /api/companies, dan /api/index)
# benar-benar menguji jalur data, bukan dilewati; 503 kini berarti
# seed ikut gagal dan membuat cek gagal. Jangkar /changelog dibaca
# dari versi package.json, bukan dikode keras. Langkah ini juga
# memeriksa isi halaman yang di-render dari seed (beranda memuat
# total perusahaan + satu perusahaan target, halaman detail memuat
# namanya) — cakupan yang tidak dimiliki smoke-check.mjs, yang hanya
# memeriksa API dan status halaman.
# Server dimatikan lagi di akhir langkah.
# Langkah E2E menjalankan suite Playwright (web/e2e/) melawan server
# produksi dari hasil build di atas (port 3000, Playwright yang
# menjalankannya lewat webServer di playwright.config.mjs). Auth,
# Firestore klien, dan push di-mock di dalam tes (lihat e2e/helpers/),
# jadi tidak ada akun atau langganan yang dibuat di mana pun.
# Langkah VAPID membuat kunci VAPID sekali pakai untuk build ini saja
# (web/scripts/ci-vapid-public-key.mjs): hanya kunci PUBLIK yang
# ditulis ke GITHUB_ENV; kunci privat tidak pernah dicetak.
# Langkah Coverage menjalankan suite yang sama dengan pelaporan
# cakupan dan ambang (lihat test:coverage di web/package.json);
# laporan mentah V8 diunggah sebagai artifact.
# Langkah Bundle budget memeriksa hasil build terhadap anggaran
# (web/scripts/check-bundle-budget.mjs) dan gagal bila terlewati.
name: App

on:
  push:
    # Branch fase2/** ikut menjalankan CI penuh: paket-paket Fase 2
    # dikerjakan di branch fase2/p-NN dan harus terbukti hijau
    # SEBELUM push ke main, bukan sesudahnya.
    branches: [main, "fase2/**"]
  pull_request:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24.x: sama dengan engines di web/package.json dan
          # .nvmrc — CI menguji runtime yang sama dengan produksi
          # (Vercel memakai engines). Node 20 sudah end-of-life.
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Coverage
        working-directory: web
        run: npm run test:coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-v8
          path: web/coverage
          retention-days: 30
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: VAPID key (CI-only, public only)
        working-directory: web
        run: node scripts/ci-vapid-public-key.mjs
      - name: Build
        working-directory: web
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaDummyDummyDummyDummyDummyDummy12
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: karir-9d53a.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: karir-9d53a
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: karir-9d53a.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ env.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: npm run build
      - name: Bundle budget
        working-directory: web
        run: npm run check:bundle
      - name: Smoke
        working-directory: web
        env:
          # Nilai dummy untuk server asap lokal saja: /api/token memakai
          # API_TOKEN_SECRET dan batas laju memakai ANALYTICS_SALT, dan
          # keduanya fail-closed bila kosong. Nilai ini hanya hidup di
          # runner CI yang dibuang setelah run; bukan secret produksi.
          API_TOKEN_SECRET: ci-dummy-bukan-rahasia
          ANALYTICS_SALT: ci-dummy-bukan-rahasia
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaDummyDummyDummyDummyDummyDummy12
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: karir-9d53a.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: karir-9d53a
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: karir-9d53a.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          BASE_URL: http://localhost:3000
        run: |
          npx next start -p 3000 > /tmp/next-smoke.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/changelog > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          STATUS=0
          node scripts/smoke-check.mjs || STATUS=$?
          # Cek halaman dari seed: smoke-check.mjs di atas memeriksa API
          # dan status halaman, tetapi tidak memeriksa isi halaman yang
          # di-render. Beranda dan halaman detail di-render dari seed
          # saat Firestore mati (getCompaniesOrSeed), sehingga isinya
          # dicek di sini: beranda harus memuat total perusahaan dan
          # satu perusahaan target, dan halaman detail perusahaan itu
          # harus memuat namanya. Total, nomor, dan nama
          # dibaca dari seed, bukan dikode keras, supaya cek ikut saat
          # data berubah lewat hunting harian. Nama yang mengandung & atau
          # < dilewati karena lolos HTML akan mengubah penulisannya.
          # Output curl ditulis ke berkas lalu di-grep dari berkas, bukan
          # `curl | grep -q`: di bawah `pipefail`, grep yang keluar lebih
          # dulu setelah menemukan kecocokan membuat curl kena SIGPIPE
          # (kode 23) dan cek gagal palsu. Batas 60 detik mencegah curl
          # menggantung bila server macet.
          SEED_TOTAL=$(python3 -c "import json; print(len(json.load(open('data/companies.json'))))")
          SEED_FIRST=$(python3 -c "import json; s=json.load(open('data/companies.json')); c=next(x for x in s if x['status']=='Ada lowongan' and '&' not in x['perusahaan'] and '<' not in x['perusahaan']); print(str(c['no']) + '|' + c['perusahaan'])")
          SEED_NO="${SEED_FIRST%%|*}"
          SEED_NAME="${SEED_FIRST#*|}"
          if ! curl -fsS --max-time 60 http://localhost:3000/ -o /tmp/seed-home.html; then
            echo "Cek seed gagal: beranda tidak bisa dimuat"
            STATUS=1
          else
            if ! grep -F -q "$SEED_TOTAL" /tmp/seed-home.html; then
              echo "Cek seed gagal: beranda tidak memuat total $SEED_TOTAL"
              STATUS=1
            fi
            if ! grep -F -q "$SEED_NAME" /tmp/seed-home.html; then
              echo "Cek seed gagal: beranda tidak memuat $SEED_NAME"
              STATUS=1
            fi
          fi
          if ! curl -fsS --max-time 60 "http://localhost:3000/perusahaan/$SEED_NO" -o /tmp/seed-detail.html; then
            echo "Cek seed gagal: /perusahaan/$SEED_NO tidak bisa dimuat"
            STATUS=1
          elif ! grep -F -q "$SEED_NAME" /tmp/seed-detail.html; then
            echo "Cek seed gagal: /perusahaan/$SEED_NO tidak memuat $SEED_NAME"
            STATUS=1
          fi
          kill $SERVER_PID 2>/dev/null || true
          pkill -f "[n]ext-server" 2>/dev/null || true
          if [ "$STATUS" -ne 0 ]; then
            echo "--- log server ---"
            tail -20 /tmp/next-smoke.log || true
          fi
          exit $STATUS
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: E2E
        working-directory: web
        env:
          # Nilai dummy yang sama dengan langkah Smoke: server yang
          # dijalankan Playwright (webServer) butuh nilai-nilai ini
          # supaya /api/token dan batas laju tidak fail-closed.
          API_TOKEN_SECRET: ci-dummy-bukan-rahasia
          ANALYTICS_SALT: ci-dummy-bukan-rahasia
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaDummyDummyDummyDummyDummyDummy12
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: karir-9d53a.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: karir-9d53a
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: karir-9d53a.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
        run: npm run test:e2e
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            web/test-results
            web/playwright-report
          retention-days: 30
