# Arsip bulanan riwayat changes Karir (P-03, D4).
#
# Cron cleanup menghapus dokumen `changes` berumur >180 hari tiap
# Senin; tanpa arsip, riwayat perubahan status hilang permanen di
# hari ke-181 (artifact backup hanya bertahan 90 hari). Workflow ini
# mengarsipkan dokumen changes berumur >150 hari ke repo
# (data/archives/changes-archive-{YYYY-MM}.json) tiap tanggal 1,
# SEBELUM cleanup sempat menghapusnya — arsip adalah prasyarat
# penghapusan, bukan kegiatan sesudahnya. Margin 30 hari (150 vs
# 180) memastikan tidak ada dokumen yang terhapus sebelum diarsipkan
# (lihat penjelasan lengkap di web/scripts/archive-changes.mjs).
#
# Isi arsip adalah DATA PUBLIK (nomor, nama perusahaan, status
# lama/baru, tanggal) tanpa data pengguna — aman di-commit ke repo.
# Satu-satunya workflow selain write-back yang men-commit ke main.
#
# KREDENSIAL: job ini butuh FIREBASE_SERVICE_ACCOUNT (string JSON
# service account baca Firestore) — secret yang sama dengan
# backup.yml. Nilainya tidak pernah ditulis di repo atau di workflow
# ini. Bila secret belum dipasang, run GAGAL dengan pesan yang jelas.
#
# Jadwal: tiap tanggal 1 pukul 02:00 UTC (09:00 WIB), plus jalan
# manual lewat workflow_dispatch. Bila run gagal (mis. kuota
# Firestore habis), jalankan manual segera sesudah kuota pulih —
# JANGAN menunggu tanggal 1 berikutnya, karena cleanup Senin
# berikutnya dapat menghapus dokumen yang belum terarsip.
name: Arsip changes bulanan

on:
  schedule:
    # 02:00 UTC = 09:00 WIB tiap tanggal 1.
    - cron: "0 2 1 * *"
  workflow_dispatch:

# Satu run arsip dalam satu waktu; run yang tumpang tindih
# mengantre (bukan dibatalkan) supaya tidak ada bulan yang terlewat.
concurrency:
  group: archive-changes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # Node 24.x: sama dengan engines di web/package.json dan
          # .nvmrc — konsisten dengan workflow app.yml.
          node-version: "24.x"
      - name: Arsipkan changes berumur >150 hari
        working-directory: web
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/archive-changes.mjs
      - name: Commit dan push bila ada perubahan
        run: |
          if git status --porcelain data/archives/ | grep -q .; then
            git config user.name "karir-archive[bot]"
            git config user.email "karir-archive[bot]@users.noreply.github.com"
            git pull --rebase origin main || git pull --rebase origin HEAD
            git add data/archives/
            git commit -m "Arsip changes bulanan: $(date -u +%Y-%m)"
            git push origin HEAD:main
          else
            echo "Tidak ada entri baru untuk diarsipkan."
          fi
