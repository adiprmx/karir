# E2E melawan deployment pratinjau Vercel (P-01, kriteria 6).
# Dijalankan manual (workflow_dispatch) dengan URL pratinjau sebagai
# input, sesudah Vercel selesai men-deploy branch paket. Suite yang
# sama dengan langkah E2E di app.yml, tetapi melawan URL luar tanpa
# menjalankan server lokal (E2E_BASE_URL di playwright.config.mjs).
# Mock Auth/Firestore/push di dalam tes berlaku juga di sini, jadi
# tidak ada akun, langganan, atau data yang dibuat di produksi.
# Cara pakai: Actions > E2E preview > Run workflow > pilih branch
# paket > isi base_url dengan URL pratinjau Vercel.
name: E2E preview

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL deployment pratinjau Vercel yang diuji"
        required: true
        type: string

jobs:
  e2e-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: E2E against preview
        working-directory: web
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
        run: npm run test:e2e
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-preview-results
          path: |
            web/test-results
            web/playwright-report
          retention-days: 30
