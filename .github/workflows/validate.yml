name: Validate data

on:
  push:
    paths:
      - "data/daftar-link-karir.csv"
      - "data/holdlist-status.txt"
      - "web/data/companies.json"
      - "README.md"
      - "assets/status-bar.svg"
      - "scripts/validate.py"
      - "scripts/test_validate.py"
      - "scripts/check-consistency.py"
      - "scripts/check-seed-live.py"
      - "scripts/regenerate_readme.py"
      - "scripts/test_regenerate_readme.py"
      - "scripts/import_canonical.py"
      - "scripts/write_back.py"
      - "scripts/sa_token.py"
      - "scripts/test_p03_repo_scripts.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "data/daftar-link-karir.csv"
      - "data/holdlist-status.txt"
      - "web/data/companies.json"
      - "README.md"
      - "assets/status-bar.svg"
      - "scripts/validate.py"
      - "scripts/test_validate.py"
      - "scripts/check-consistency.py"
      - "scripts/check-seed-live.py"
      - "scripts/regenerate_readme.py"
      - "scripts/test_regenerate_readme.py"
      - "scripts/import_canonical.py"
      - "scripts/write_back.py"
      - "scripts/sa_token.py"
      - "scripts/test_p03_repo_scripts.py"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate CSV
        run: python3 scripts/validate.py
      # Test atas validatornya sendiri (QA-14): CSV contoh sah/cacat
      # di scripts/test_validate.py; plus test regenerasi README
      # (P-02, K-08) dan test salinan berversi skrip impor/write-back
      # (P-03, T11). pytest dipasang dulu karena image ubuntu-latest
      # tidak membawanya secara bawaan.
      - name: Test validator + regenerasi (pytest)
        run: |
          pip install pytest
          python3 -m pytest scripts/test_validate.py scripts/test_regenerate_readme.py scripts/test_p03_repo_scripts.py -q
      # Cek ini mencakup DOK-01 (angka README vs CSV) dalam mode
      # non-live; README.md ada di paths pemicu di atas supaya cek
      # jalan tiap push yang mengubah README.
      - name: Check CSV vs seed + README consistency
        run: python3 scripts/check-consistency.py
      # Cek live hanya di main: butuh situs produksi yang sudah menayangkan
      # commit ini. Di pull request, situs live masih menayangkan main lama
      # sehingga perbandingan live vs CSV baru pasti salah.
      - name: Check consistency vs live site
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/check-consistency.py --live
      # Cek jumlah seed vs live (P-01, mendukung BE2-03): satu panggilan
      # /api/stats, murah kuota. Ambang penegakan ditetapkan P-02:
      # --max-drift 0 — jumlah seed WAJIB sama persis dengan total live
      # (drift penutup: keduanya 685). Hunting menambah perusahaan lewat
      # impor Firestore + commit CSV/seed yang sama, jadi di luar jendela
      # impor-komitmen (tanpa CI yang jalan) keduanya selalu sama.
      # always(): cek ini harus jalan walau langkah konsistensi di atas
      # gagal (drift live yang sudah diketahui) — kalau tidak, laporan
      # drift justru tidak pernah terbit saat paling dibutuhkan.
      - name: Check seed count vs live count
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        run: python3 scripts/check-seed-live.py --max-drift 0
