name: Validate data

on:
  push:
    paths:
      - "data/daftar-link-karir.csv"
      - "scripts/validate.py"
  pull_request:
    paths:
      - "data/daftar-link-karir.csv"
      - "scripts/validate.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate CSV
        run: python3 scripts/validate.py
