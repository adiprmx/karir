      <text x="0" y="3770" font-size="170" font-weight="800" fill="#16a34a">20</text>
      <text x="0" y="3950" font-size="170" font-weight="800" fill="#16a34a">21</text>
      <text x="0" y="4130" font-size="170" font-weight="800" fill="#16a34a">22</text>
      </g>
    </g>
  </g>
