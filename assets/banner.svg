<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Karir: 22 lowongan target dari 406 kanal karir resmi">
  <title>Karir — 22 lowongan target</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; }
    .wordmark { animation: rise 0.9s cubic-bezier(0.16,1,0.3,1) both; }
    .label { animation: fadein 0.9s ease 0.9s both; }
    .odo-wrap { animation: pulse 2.6s ease-in-out 2.8s infinite; }
    .odo { animation: count 2.2s steps(22) 0.4s both; }
    .seg { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 0.9s cubic-bezier(0.16,1,0.3,1) both; }
    .seg0 { animation-delay: 0.5s; } .seg1 { animation-delay: 0.65s; } .seg2 { animation-delay: 0.8s; }
    .seg3 { animation-delay: 0.95s; } .seg4 { animation-delay: 1.1s; } .seg5 { animation-delay: 1.25s; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes count { from { transform: translateY(0); } to { transform: translateY(-3960px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.82; } }
    @media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}
  </style>
  <defs>
    <!-- clip window in root user space (absolute x56-286, y210-400);
         must NOT live inside the translated group: userSpaceOnUse clips are
         evaluated in the referencing element's user space, so a rect defined
         inside translate(56,172) was shifted +172 down and never met the digits. -->
    <clipPath id="odo-clip"><rect x="56" y="210" width="230" height="190"/></clipPath>
  </defs>
  <rect width="1200" height="460" fill="#0a0a0a"/>
  <text class="wordmark" x="56" y="178" font-size="150" font-weight="800" letter-spacing="-5" fill="#ffffff">KARIR</text>
  <g class="odo-wrap" clip-path="url(#odo-clip)">
    <g transform="translate(56, 172)">
      <g class="odo">
      <text x="0" y="170" font-size="170" font-weight="800" fill="#16a34a">0</text>
      <text x="0" y="350" font-size="170" font-weight="800" fill="#16a34a">1</text>
