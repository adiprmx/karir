<svg xmlns="http://www.w3.org/2000/svg" width="640" height="624" viewBox="0 0 640 624" role="img" aria-label="Alur Karir: kanal karir resmi, diperiksa di browser, data CSV dan XLSX, Firestore 406 dokumen, aplikasi web dan API, pengunjung cari loker">
