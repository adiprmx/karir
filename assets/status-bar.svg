<svg xmlns="http://www.w3.org/2000/svg" width="700" height="296" viewBox="0 0 700 296" role="img" aria-label="Sebaran status 610 kanal karir: 288 ada lowongan, 156 tidak ada lowongan, 111 tidak dapat diverifikasi, 55 portal tidak bisa dibuka">
  <title>Sebaran status 610 kanal karir</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; }
    .row { animation: rowin 0.6s cubic-bezier(0.16,1,0.3,1) both; }
    .r0 { animation-delay: 0.05s; } .r1 { animation-delay: 0.2s; } .r2 { animation-delay: 0.35s; }
    .r3 { animation-delay: 0.5s; }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 0.8s cubic-bezier(0.16,1,0.3,1) both; }
    .num { opacity: 0; animation: fadein 0.5s ease both; }
    .b0 { animation-delay: 0.15s; } .n0 { animation-delay: 0.45s; }
    .b1 { animation-delay: 0.33s; } .n1 { animation-delay: 0.63s; }
    .b2 { animation-delay: 0.51s; } .n2 { animation-delay: 0.81s; }
    .b3 { animation-delay: 0.69s; } .n3 { animation-delay: 0.99s; }
    @keyframes rowin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; transform: none !important; }
}
  </style>
  <rect width="700" height="296" fill="#ffffff"/>
  <g class="row r0">
    <text x="0" y="48" font-size="24" font-weight="600" fill="#111111">Ada lowongan</text>
    <rect class="bar b0" x="0" y="58" width="558.1" height="22" fill="#16a34a"/>
    <text class="num n0" x="572.1" y="79" font-size="28" font-weight="800" fill="#16a34a">288</text>
  </g>
  <g class="row r1">
    <text x="0" y="114" font-size="24" font-weight="600" fill="#111111">Tidak ada lowongan</text>
    <rect class="bar b1" x="0" y="124" width="302.3" height="22" fill="#525252"/>
    <text class="num n1" x="316.3" y="145" font-size="28" font-weight="800" fill="#525252">156</text>
  </g>
  <g class="row r2">
    <text x="0" y="180" font-size="24" font-weight="600" fill="#111111">Tidak dapat diverifikasi</text>
    <rect class="bar b2" x="0" y="190" width="215.1" height="22" fill="#a3a3a3"/>
    <text class="num n2" x="229.1" y="211" font-size="28" font-weight="800" fill="#a3a3a3">111</text>
  </g>
  <g class="row r3">
    <text x="0" y="246" font-size="24" font-weight="600" fill="#111111">Portal tidak bisa dibuka</text>
    <rect class="bar b3" x="0" y="256" width="106.6" height="22" fill="#c9c9c9"/>
    <text class="num n3" x="120.6" y="277" font-size="28" font-weight="800" fill="#c9c9c9">55</text>
  </g>
</svg>
